<!doctype html><html lang="de"><meta charset="utf-8"><title>Test · 2 × Zoom → Block → Platz → cart add</title>
<style>body{font:16px system-ui;margin:20px;color:#173d29}h1{font-size:25px;margin:0 0 8px}#arena{position:relative;height:650px;background:white;border:1px solid #aaa;overflow:hidden}#pitch{position:absolute;left:30%;top:25%;width:40%;height:45%;background:#366c23;border:4px solid white;outline:2px solid #366c23}#pitch:before{content:'';position:absolute;left:50%;top:0;height:100%;border-left:2px solid white}#mini{display:none;position:absolute;right:20px;top:20px;background:white;width:160px;height:120px;border:1px solid #ddd}#seat{display:none;position:absolute;left:55%;top:65%;width:16px;height:16px;border-radius:50%;background:#a3a56c;cursor:pointer}#cart{position:fixed;bottom:25px;right:25px;padding:16px 28px;border:2px solid #009b50;background:white;cursor:pointer}button{font:inherit;padding:7px 12px;margin:5px}output{display:block;margin:10px 0}</style>
<h1>2 × Zoom → farbiger Block → freier Platz → cart add</h1><p>Den großen Kartenbereich im Wächter markieren und den Ablauf starten. Ohne Häkchen wird nur gezoomt und ein Block erkannt. Die Miniaturübersicht erscheint nach genau zwei Zoomereignissen.</p><button id="reset">Ganz herausgezoomte Ausgangsansicht wiederherstellen</button><output id="log">Ausgangsansicht · Zoom 0/2</output>
<div id="arena"><div id="pitch"></div><div id="mini" class="minimap"><svg width="160" height="120"><rect x="56" y="40" width="48" height="35" fill="#366c23"/><rect x="48" y="30" width="64" height="55" fill="none" stroke="blue"/><rect id="N4" x="15" y="20" width="12" height="15" fill="#eaeaea"/><rect id="S1" x="70" y="6" width="20" height="10" fill="#a3a56c" style="cursor:pointer"/></svg></div><div id="seat"></div></div>
<script>
const $=id=>document.getElementById(id);let steps=0;
$('arena').addEventListener('wheel',event=>{event.preventDefault();if(event.deltaY>=0)return;steps++;$('arena').style.background=['#ddd','#bbb'][Math.min(steps-1,1)];$('pitch').style.transform=`scale(${1+steps*.08})`;$('log').textContent=`Zoom ${steps}/2`;if(steps>=2)$('mini').style.display='block';},{passive:false});
$('S1').onclick=()=>{if(steps<2)return;$('pitch').style.display='none';$('arena').style.background='white';$('seat').style.display='block';$('S1').setAttribute('fill','#eaeaea');$('log').textContent='Block geöffnet · jetzt ist der freie Sitz sichtbar.'};
$('seat').onclick=()=>{$('seat').style.background='#1766bb';$('log').textContent='Sitz gewählt · cart add erscheint.';if($('cart'))return;const button=document.createElement('button');button.id='cart';button.title='cart add';button.innerHTML='<svg width="30" height="30"><path d="M1 2h5l4 16h15M13 25a2 2 0 1 0 .1 0M23 25a2 2 0 1 0 .1 0" stroke="black" stroke-width="2" fill="none"/><path d="M25 1v8M21 5h8" stroke="black" stroke-width="2"/></svg>';button.onclick=()=>{button.remove();$('log').textContent='Erfolg: genau zwei Zoomereignisse → Block → freier Sitz → cart add.'};document.body.append(button);};
$('reset').onclick=()=>{steps=0;$('arena').style.background='white';$('pitch').style.display='block';$('pitch').style.transform='';$('mini').style.display='none';$('seat').style.display='none';$('seat').style.background='#a3a56c';$('S1').setAttribute('fill','#a3a56c');$('cart')?.remove();$('log').textContent='Ausgangsansicht · Zoom 0/2';};
</script></html>
