<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Ticket-Töne</title>
<h1>Warenkorbton</h1>
<p>Eine eigene Nebelhorn-Aufnahme auswählen (MP3, WAV, OGG oder M4A, bis 1 MB).
   Ohne Aufnahme ertönt ein synthetisches Nebelhorn.</p>
<label>Nebelhorn-Datei <input id="horn" type="file" accept=".mp3,.wav,.ogg,.m4a,.m4r"></label>
<button id="reset" type="button">Auf Standardton zurücksetzen</button>
<p id="status" role="status"></p>
<script src="audio-options.js" defer></script>
</html>
